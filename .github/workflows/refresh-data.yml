name: Panorama - independent source refresh

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish validated sources while retaining delayed sources
        type: boolean
        default: false
      scope:
        description: Sources to collect (Growth includes its commercial SSOT dependency)
        type: choice
        options: [all, growth]
        default: all
  schedule:
    # Hourly recovery checks, 08:17-20:17 Sao Paulo. GitHub may delay or drop runs.
    # Collect every four hours, or sooner when core data is behind D-1.
    - cron: '17 11-23 * * *'

permissions:
  contents: read

concurrency:
  group: panorama-production-data
  cancel-in-progress: false

jobs:
  freshness:
    permissions:
      contents: read
      actions: read
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PANORAMA_CLOUD_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      refresh: ${{ steps.check.outputs.refresh }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test freshness rules without credentials
        run: |
          python3 -m unittest discover -s scripts -p 'test_refresh_freshness.py'
          python3 -m unittest discover -s scripts -p 'test_refresh_manual_cooldown.py'
      - name: Check published data before collecting
        id: check
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          REFRESH_SCOPE: ${{ inputs.scope || 'all' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$FORCE" = "true" ] && [ "$REFRESH_SCOPE" = "growth" ]; then
            python3 scripts/check_data_freshness.py --force --manual
          elif [ "$FORCE" = "true" ]; then
            python3 scripts/check_data_freshness.py --force
          else
            python3 scripts/check_data_freshness.py
          fi
  refresh:
    needs: freshness
    if: needs.freshness.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: panorama-data
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install reviewed collector dependencies
        run: |
          pip install -r scripts/requirements-cloud.txt
          npm install --global vercel@65.3.1
      - name: Test before accessing credentials
        run: |
          python -m unittest discover -s scripts -p 'test_cloud_refresh.py'
          python -m unittest discover -s scripts -p 'test_refresh*.py'
          python -m unittest discover -s scripts -p 'test_growth_observed_bridge.py'
          node scripts/test_release_contract.cjs
          node scripts/test_release_data.cjs
          node scripts/test_growth_refresh_api.cjs
      - name: Check fixed identity configuration
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test "$SERVICE_ACCOUNT" = 'panorama-data-reader@reise-ssot.iam.gserviceaccount.com'
          test "$PROVIDER" = 'projects/482129139926/locations/global/workloadIdentityPools/panorama-github/providers/github'
          test "$GITHUB_REPOSITORY_ID" = '1434889171'
          test "$GITHUB_REPOSITORY_OWNER_ID" = '153780526'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: reise-ssot
          create_credentials_file: true
      - name: Refresh sources and publish validated data
        env:
          PANORAMA_SHEETS_AUTH: workload_identity
          PANORAMA_CATALOG_BUCKET: ${{ vars.PANORAMA_CATALOG_BUCKET }}
          VERCEL_TOKEN: ${{ (github.event_name == 'schedule' || inputs.publish) && secrets.VERCEL_TOKEN || '' }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
          REFRESH_SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            test -n "$VERCEL_TOKEN"
            python scripts/cloud_refresh.py --independent-sources --scope "$REFRESH_SCOPE" --publish
          else
            python scripts/cloud_refresh.py --independent-sources --scope "$REFRESH_SCOPE"
          fi
      - name: Verify published core data reaches yesterday
        if: (github.event_name == 'schedule' || inputs.publish) && inputs.scope != 'growth'
        run: python scripts/check_data_freshness.py --verify
      - name: Report failed cycle
        if: failure()
        run: |
          echo '::error::Atualizacao nao confirmada ate D-1. Consulte as fontes atrasadas no resumo; fontes validas podem ter sido publicadas.'
          echo 'Falha na atualizacao ou na verificacao de D-1. A proxima verificacao horaria tentara recuperar fontes essenciais atrasadas. Consulte o resumo por fonte.' >> "$GITHUB_STEP_SUMMARY"
