name: Panorama - manual read-only access check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panorama-access-check
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: panorama-data
    permissions:
      contents: read
      id-token: write
    env:
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test probe without contacting sources
        run: python -m unittest discover -s scripts -p 'test_cloud_access.py'
      - name: Validate fixed workflow identity
        run: python -c "import os, sys; sys.path.insert(0, 'scripts'); from check_cloud_access import validate_config; validate_config(os.environ)"
      - name: Install pinned Google clients
        run: pip install google-cloud-bigquery==3.46.2 google-auth==2.62.0 requests==2.34.2
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: reise-ssot
          create_credentials_file: true
      - name: Verify read access without writing source data
        run: python scripts/check_cloud_access.py
