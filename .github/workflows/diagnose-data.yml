name: Panorama - full read-only collection diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panorama-production-data
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: panorama-data
    permissions:
      contents: read
      id-token: write
    env:
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      PANORAMA_CATALOG_BUCKET: ${{ vars.PANORAMA_CATALOG_BUCKET }}
      PANORAMA_SHEETS_AUTH: workload_identity
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install reviewed read clients
        run: pip install -r scripts/requirements-cloud.txt
      - name: Test collectors before authentication
        run: |
          python -m unittest discover -s scripts -p 'test_cloud_access.py'
          python -m unittest discover -s scripts -p 'test_cloud_refresh.py'
          python -m unittest discover -s scripts -p 'test_refresh*.py'
          python -m unittest discover -s scripts -p 'test_growth_observed_bridge.py'
      - name: Validate fixed workflow identity
        run: python -c "import os, sys; sys.path.insert(0, 'scripts'); from check_cloud_access import validate_config; validate_config(os.environ)"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: reise-ssot
          create_credentials_file: true
      - name: Collect all available sources without publishing
        run: python scripts/cloud_refresh.py --diagnose
      - name: Explain diagnostic failure
        if: failure()
        run: echo 'Diagnostico bloqueado. Consulte o resumo por fonte ou a etapa que falhou. Nenhum deploy foi executado.' >> "$GITHUB_STEP_SUMMARY"
